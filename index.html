<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Air Code — Finger Drawing</title>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
*{box-sizing:border-box; touch-action:none;}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:Arial,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(.55) contrast(1.08)}
#draw{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.62) 100%)}

.footer{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:5;
  color:rgba(255,255,255,.78);
  font:12px Arial,sans-serif;
  letter-spacing:.7px;
  padding:7px 12px;
  border:1px solid rgba(0,229,255,.18);
  border-radius:14px;
  background:rgba(4,10,15,.55);
  backdrop-filter:blur(8px);
}
.footer b{color:#00e5ff;font-weight:600}

.ui{position:fixed;inset:0;z-index:4;pointer-events:none}
.title{position:absolute;top:24px;left:28px;font-weight:700;letter-spacing:3px;font-size:15px;text-transform:uppercase}
.status{position:absolute;top:22px;right:25px;padding:9px 13px;border:1px solid #24506a;border-radius:20px;background:rgba(4,12,18,.7);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:7px}
.dot.on{background:#00e5ff;box-shadow:0 0 12px #00e5ff}
.help{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:rgba(4,8,12,.72);border:1px solid #263c49;color:#b7c7d0;font-size:12px;text-align:center;width:90%;max-width:320px}
.controls{position:absolute;right:25px;bottom:24px;display:flex;gap:8px;pointer-events:auto}
button{border:1px solid #315263;background:#0b151c;color:#d8f8ff;padding:10px 13px;border-radius:9px;cursor:pointer}
button:hover{background:#10222c}
#start{position:fixed;inset:0;z-index:10;background:#05070a;display:grid;place-items:center}
.panel{text-align:center;width:min(90%,480px);padding:34px;border:1px solid #203846;border-radius:20px;background:#091117;box-shadow:0 0 80px rgba(0,190,255,.08)}
.panel h1{margin:0 0 10px;font-size:30px}.panel p{color:#91a5b0;line-height:1.6}
#startBtn{font-size:15px;padding:13px 22px;background:#0b2530;border-color:#00a6d6;pointer-events:auto}
.note{font-size:11px;color:#657782;margin-top:14px}
</style>
</head>
<body>

<video id="camera" autoplay muted playsinline></video>
<canvas id="draw"></canvas>
<div class="vignette"></div>

<div class="footer">
  Designed &amp; Programmed by
  <b><a href="https://www.instagram.com/sinan._u/" target="_blank" rel="noopener noreferrer">@sinan._u</a></b>
</div>

<div class="ui">
  <div class="title">AIR CODE</div>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Camera off</span></div>

  <div class="help">
    ☝ Raise index finger to draw · ✊ Lower finger to stop
  </div>

  <div class="controls">
    <button id="clearBtn">Clear</button>
    <button id="colorBtn">Color</button>
  </div>
</div>

<div id="start">
  <div class="panel">
    <h1>✦ Air Code</h1>
    <p>Use your camera and index finger as a virtual pen.</p>
    <button id="startBtn">Start Camera</button>
    <div class="note">Camera permission is required. Must be hosted via HTTPS.</div>
  </div>
</div>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("draw");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("start");
const startBtn = document.getElementById("startBtn");
const clearBtn = document.getElementById("clearBtn");
const colorBtn = document.getElementById("colorBtn");
const statusEl = document.getElementById("status");
const dot = document.getElementById("dot");

let lastX = null, lastY = null;
let drawing = false;
let colorIndex = 0;
const colors = ["#00e5ff","#7cff6b","#ff4fd8","#ffd84d","#ffffff"];

const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}
addEventListener("resize", resize);
resize();

function clearCanvas(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  lastX = lastY = null;
}
clearBtn.onclick = clearCanvas;

colorBtn.onclick = ()=>{
  colorIndex = (colorIndex+1)%colors.length;
  colorBtn.textContent = "Color";
};

function drawPoint(x,y){
  const color = colors[colorIndex];

  if(lastX !== null && lastY !== null){
    ctx.save();
    ctx.lineCap="round";
    ctx.lineJoin="round";

    if(!isMobile){
      ctx.shadowBlur = 15;
      ctx.shadowColor = color;
    }

    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    ctx.restore();
  }

  lastX=x; lastY=y;
}

function stopDrawing(){
  drawing=false;
  lastX=lastY=null;
}

const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: isMobile ? 0 : 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

hands.onResults(results=>{
  if(!results.multiHandLandmarks || !results.multiHandLandmarks.length){
    stopDrawing();
    statusEl.textContent="Show your hand";
    dot.classList.remove("on");
    return;
  }

  const lm = results.multiHandLandmarks[0];
  const tip = lm[8], pip = lm[6];

  // Relaxed condition for mobile screen orientation
  const raised = tip.y < pip.y;

  if(!raised){
    stopDrawing();
    statusEl.textContent="Point index finger up";
    dot.classList.remove("on");
    return;
  }

  // Calculate object-fit: cover offsets for mobile screens
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  const sw = window.innerWidth;
  const sh = window.innerHeight;

  const videoRatio = vw / vh;
  const screenRatio = sw / sh;

  let scale, offsetX = 0, offsetY = 0;

  if (screenRatio > videoRatio) {
    scale = sw / vw;
    offsetY = (sh - vh * scale) / 2;
  } else {
    scale = sh / vh;
    offsetX = (sw - vw * scale) / 2;
  }

  // Convert mirrored coordinates to screen pixel positions
  const rawX = (1 - tip.x) * vw;
  const rawY = tip.y * vh;

  const x = rawX * scale + offsetX;
  const y = rawY * scale + offsetY;

  statusEl.textContent="Drawing";
  dot.classList.add("on");

  if(!drawing){
    drawing=true;
    lastX=x; lastY=y;
    return;
  }

  drawPoint(x,y);
});

let camera;

startBtn.onclick = async ()=>{
  try{
    startBtn.disabled=true;
    startBtn.textContent="Opening camera...";

    const constraints = {
      video: {
        facingMode: "user",
        width: { ideal: isMobile ? 640 : 1280 },
        height: { ideal: isMobile ? 480 : 720 }
      },
      audio: false
    };

    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();

    camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({image: video});
      },
      width: isMobile ? 640 : 1280,
      height: isMobile ? 480 : 720
    });

    camera.start();
    startScreen.style.display="none";
    statusEl.textContent="Show your index finger";
  }catch(err){
    console.error(err);
    startBtn.disabled=false;
    startBtn.textContent="Try Again";
    alert("Camera permission denied or HTTPS is required on hosted servers.");
  }
};
</script>
</body>
</html>
